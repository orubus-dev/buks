name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Building only reads the repository: Gradle and its dependencies get no write access.
# Writing (publishing a release) is a separate job below, and only on the main branch or a tag.
permissions:
  contents: read

# SHA-256 fingerprint of the Buks signing key (the fork's own key, secret KEYSTORE_BASE64).
# If the secret is ever swapped for another key, the build stops: otherwise updates would stop installing.
env:
  SIGNING_CERT_SHA256: 46b315cd91bb4b5ecf010b6f44107aec045b481eb44d0465a2481055ce00c901

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      release: ${{ steps.ver.outputs.release }}
      update: ${{ steps.ver.outputs.update }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # A release goes out automatically when versionName is raised in app/build.gradle
      # (or when a v* tag is pushed). If a release for this version already exists,
      # a push to the main branch just refreshes its description.
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          v=$(grep -oP 'versionName "\K[0-9A-Za-z.\-]+(?=")' app/build.gradle)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          # The tag goes into the release name and into gh commands — letters, digits, dots and dashes only
          if [[ ! "$tag" =~ ^v[0-9A-Za-z.\-]+$ ]]; then echo "Bad tag: $tag" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          exists=false
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          release=false
          update=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            if [[ "$exists" == true ]]; then update=true; else release=true; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

      # Gradle builds the APK unsigned: it never sees the key, and neither does any third-party build code
      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      # Signing is a separate step: the key from secrets exists only here and is deleted right after
      - name: Sign
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE: ${{ steps.ver.outputs.release }}
          UPDATE: ${{ steps.ver.outputs.update }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            if [[ "$RELEASE" == true || "$UPDATE" == true ]]; then
              echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets are missing — no release without a signature"
              exit 1
            fi
            echo "::notice::No keystore secrets (e.g. a pull request from a fork) — APK built but not signed and not published"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ks="$RUNNER_TEMP/buks.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # First — is it the right key in the secret
          info=$(keytool -list -v -keystore "$ks" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -alias buks)
          key=$(awk -F'SHA256: *' 'NF > 1 {gsub(":", "", $2); print tolower($2); exit}' <<<"$info")
          if [[ "$key" != "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::KEYSTORE_BASE64 holds a different key ($key) — expected $SIGNING_CERT_SHA256"
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          mkdir -p out
          "$bt/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias buks \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out out/Buks.apk "$RUNNER_TEMP/aligned.apk"
          # Then — that the APK is really signed by it (the certificate is not a secret, it is visible in the log)
          certs=$("$bt/apksigner" verify --verbose --print-certs out/Buks.apk)
          echo "$certs"
          got=$(awk 'tolower($0) ~ /certificate sha-256 digest:/ {print tolower($NF); exit}' <<<"$certs")
          if [[ "$got" != "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::APK signed with the wrong key ($got) — expected $SIGNING_CERT_SHA256"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Test APKs live for a week: they disappear on their own, versions for everyone are in releases
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: Buks-apk
          path: out/Buks.apk
          retention-days: 7

  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && (needs.build.outputs.release == 'true' || needs.build.outputs.update == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: Buks-apk
          path: out

      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          section() { awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' "$1"; }
          {
            section CHANGELOG.md
            printf '\n**Install:** download `Buks.apk` below and open it on your phone. This is the Orubus build (`app.orubus.buks`) — it installs alongside the original QuickNovel, they do not overwrite each other. A new version installs over the old one, your library and settings are kept.\n'
          } > notes.md
          cat notes.md

      # gh itself publishes the release — no third-party actions trusted with write access
      - name: Release
        if: needs.build.outputs.release == 'true'
        run: |
          gh release create "$TAG" out/Buks.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Buks $TAG" --notes-file notes.md --latest

      - name: Refresh description of the published release
        if: needs.build.outputs.update == 'true'
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --title "Buks $TAG"
